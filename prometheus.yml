global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'safealert-dispatch'
    static_configs:
      - targets: ['safealert-dispatch:80']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3001']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'alert-service'
    static_configs:
      - targets: ['alert-service:3001']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'messaging-service'
    static_configs:
      - targets: ['messaging-service:3001']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'billing-service'
    static_configs:
      - targets: ['billing-service:3001']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

rule_files:
  - 'rules/*.yml' 