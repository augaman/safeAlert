_format_version: "2.1"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:8000
    routes:
      - name: auth-routes
        paths:
          - /auth
          - /auth/
        strip_path: true
    plugins:
      - name: jwt
        config:
          header_names: ["Authorization"]
          claims_to_verify:
            - exp
          key_claim_name: kid
          secret_is_base64: false
          maximum_expiration: 86400
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Authorization", "Content-Type"]
          exposed_headers: ["X-RateLimit-Limit", "X-RateLimit-Remaining"]
          credentials: true
          max_age: 600

