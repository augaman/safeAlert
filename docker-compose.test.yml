version: '3.8'

services:
  api-gateway:
    image: safealert-api-gateway:test
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=test
      - JWT_SECRET=test-secret
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/safealert_test
    depends_on:
      - db
      - redis
      - auth-service
      - alert-service
      - messaging-service
      - billing-service

  auth-service:
    image: safealert-auth-service:test
    environment:
      - NODE_ENV=test
      - JWT_SECRET=test-secret
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/safealert_test
    depends_on:
      - db

  alert-service:
    image: safealert-alert-service:test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/safealert_test
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  messaging-service:
    image: safealert-messaging-service:test
    environment:
      - NODE_ENV=test
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  billing-service:
    image: safealert-billing-service:test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/safealert_test
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=safealert_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data

  prometheus:
    image: prom/prometheus:v2.42.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:9.4.7
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_test_data:/var/lib/grafana

volumes:
  postgres_test_data:
  redis_test_data:
  grafana_test_data: 