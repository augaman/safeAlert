name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'
        cache: 'npm'

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        # Install pre-commit
        pip install pre-commit
        pre-commit install

        # Install Python dependencies
        cd server
        pip install -r requirements.txt

        # Install Node.js dependencies
        cd ../client-mobile
        npm install
        cd ../dispatch-web
        npm install
        cd ../intervention-mobile
        npm install

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

    - name: Run Python tests
      run: |
        cd server
        pytest

    - name: Run JavaScript tests
      run: |
        cd client-mobile && npm test
        cd ../dispatch-web && npm test
        cd ../intervention-mobile && npm test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'
        cache: 'npm'

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install flake8 black mypy
        cd server
        pip install -r requirements.txt
        cd ../client-mobile
        npm install
        cd ../dispatch-web
        npm install
        cd ../intervention-mobile
        npm install

    - name: Run Python linters
      run: |
        cd server
        flake8 .
        black . --check
        mypy .

    - name: Run JavaScript linters
      run: |
        cd client-mobile && npm run lint
        cd ../dispatch-web && npm run lint
        cd ../intervention-mobile && npm run lint 